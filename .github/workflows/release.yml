name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS universal app bundle
        run: wails build -platform darwin/universal -s -skipbindings

      - name: Ad-hoc codesign app bundle
        run: |
          codesign --force --deep --entitlements build/darwin/entitlements.plist \
            --sign - build/bin/getdevice-api.app
          codesign --verify --deep --strict build/bin/getdevice-api.app

      - name: Package DMG
        run: |
          mkdir -p dist/dmg-staging
          cp -R build/bin/getdevice-api.app dist/dmg-staging/
          ln -sf /Applications dist/dmg-staging/Applications
          hdiutil create -volname "GetDevice ${GITHUB_REF#refs/tags/}" \
            -srcfolder dist/dmg-staging \
            -ov -format UDZO \
            "dist/GetDevice-macOS-${GITHUB_REF#refs/tags/}.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Add NSIS to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles(x86)\NSIS"

      # Wails runs makensis itself (-nsis) using our custom project.nsi,
      # which adds Start Menu shortcuts, an uninstaller with a
      # "keep my settings?" prompt, WebView2 bootstrapping, and
      # run-after-setup / desktop-shortcut options.
      - name: Build Windows installer (NSIS)
        run: wails build -platform windows/amd64 -s -skipbindings -nsis

      - name: Stage installer artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $tag = $env:GITHUB_REF.Replace('refs/tags/', '')
          Copy-Item "build/bin/getdevice-api-amd64-installer.exe" `
            "dist/GetDevice-windows-${tag}-installer.exe"
          Copy-Item "build/bin/GetDevice.exe" "dist/GetDevice-windows-${tag}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # GTK3 + WebKit2GTK dev libraries are required to link the Linux binary.
      # The runtime libs are pulled in automatically by deb/rpm dependencies.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Build Linux amd64 binary
        run: wails build -platform linux/amd64 -s -skipbindings -tags webkit2_41

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Generate Linux icon
        run: ./build/linux/scripts/gen-icon.sh

      - name: Build Linux packages (.deb, .rpm, tar.gz)
        run: |
          PKG_VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          nfpm package -f build/linux/nfpm.yaml -p deb -t dist/ -n GetDevice -v "$PKG_VERSION"
          nfpm package -f build/linux/nfpm.yaml -p rpm -t dist/ -n GetDevice -v "$PKG_VERSION"
          # Portable tarball for distros without deb/rpm
          # (single-target wails builds output build/bin/GetDevice)
          mkdir -p "dist/GetDevice-${GITHUB_REF_NAME}-linux-amd64"
          cp build/bin/GetDevice "dist/GetDevice-${GITHUB_REF_NAME}-linux-amd64/GetDevice"
          cp README.md .env.example "dist/GetDevice-${GITHUB_REF_NAME}-linux-amd64/"
          tar -czf "dist/GetDevice-linux-${GITHUB_REF_NAME}-amd64.tar.gz" \
            -C dist "GetDevice-${GITHUB_REF_NAME}-linux-amd64"
          rm -rf "dist/GetDevice-${GITHUB_REF_NAME}-linux-amd64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Generate SHA256 checksums
        id: checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          # Multiline output for the release body
          echo "shas<<EOF" >> "$GITHUB_OUTPUT"
          cat checksums.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GetDevice ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            ## GetDevice ${{ github.ref_name }}

            ### Downloads

            | Platform | File | Install |
            |----------|------|---------|
            | **macOS** (Apple Silicon + Intel) | `GetDevice-macOS-*.dmg` | Open → drag **GetDevice** to *Applications* |
            | **Windows** 64-bit | `GetDevice-windows-*-installer.exe` | Run the setup wizard |
            | **Windows** 64-bit (portable) | `GetDevice-windows-*.exe` | Just run it — no install needed |
            | **Debian / Ubuntu** | `getdevice_*_amd64.deb` | `sudo apt install ./getdevice_*_amd64.deb` |
            | **Fedora / RHEL** | `getdevice-*_amd64.rpm` | `sudo dnf install ./getdevice-*_amd64.rpm` |
            | **Any Linux** (portable) | `GetDevice-linux-*.tar.gz` | Extract & run `./GetDevice` |

            ### Notes
            - **macOS**: ad-hoc signed build — right-click the app → **Open** on first launch to bypass Gatekeeper.
            - **Linux**: packages pull in GTK3 + WebKit2GTK automatically.
            - Config lives in your user config dir (`~/Library/Application Support/GetDevice`, `%AppData%\GetDevice`, `~/.config/GetDevice`) and survives reinstalls; the Windows uninstaller asks before removing it.
            - Verify your download with `sha256sum -c checksums.txt`.
