name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Add Wails CLI to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build app bundle and DMG
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          wails3 generate icons -input build/appicon.png -macfilename build/darwin/icons.icns
          wails3 task darwin:build:universal
          app="dist/Pegasus.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp bin/Pegasus "$app/Contents/MacOS/Pegasus"
          cp build/darwin/icons.icns "$app/Contents/Resources/iconfile.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Pegasus</string>
            <key>CFBundleDisplayName</key><string>Pegasus</string>
            <key>CFBundleExecutable</key><string>Pegasus</string>
            <key>CFBundleIdentifier</key><string>com.opakk.pegasus</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>CFBundleIconFile</key><string>iconfile</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
          </dict></plist>
          EOF
          chmod +x "$app/Contents/MacOS/Pegasus"
          codesign --force --deep --sign - "$app"
          mkdir -p dist/dmg-staging
          cp -R "$app" dist/dmg-staging/
          ln -s /Applications dist/dmg-staging/Applications
          hdiutil create -volname "Pegasus $tag" -srcfolder dist/dmg-staging -ov -format UDZO "dist/Pegasus-macOS-$tag.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/Pegasus-macOS-*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install Wails v3 CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          $goBin = Join-Path (go env GOPATH) "bin"
          Add-Content $env:GITHUB_PATH $goBin
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Add NSIS to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\NSIS"
      - name: Build Pegasus GUI executable
        shell: pwsh
        run: |
          wails3 generate icons -input build/appicon.png -windowsfilename build/windows/icon.ico
          wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -out wails_windows_amd64.syso
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          go build -tags production -trimpath -ldflags="-w -s -H windowsgui" -o bin\Pegasus.exe .
          Remove-Item wails_windows_amd64.syso
      - name: Package with NSIS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $tag = $env:GITHUB_REF_NAME
          $executable = (Resolve-Path "bin\Pegasus.exe").Path
          $installer = Join-Path (Get-Location) "dist\Pegasus-windows-$tag-installer.exe"
          makensis "/DPEGASUS_EXE=$executable" "/DINSTALLER_OUT=$installer" build\windows\installer\project.nsi
          Copy-Item bin\Pegasus.exe "dist\Pegasus-windows-$tag.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install Wails v3 CLI and Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev imagemagick
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build Pegasus and Linux packages
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          wails3 task linux:build ARCH=amd64
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          ./build/linux/scripts/gen-icon.sh
          mkdir -p dist
          package_version="${GITHUB_REF_NAME#v}"
          VERSION="$package_version" nfpm package -f build/linux/nfpm.yaml -p deb -t dist/
          VERSION="$package_version" nfpm package -f build/linux/nfpm.yaml -p rpm -t dist/
          mkdir -p "dist/Pegasus-${GITHUB_REF_NAME}-linux-amd64"
          cp bin/Pegasus README.md .env.example "dist/Pegasus-${GITHUB_REF_NAME}-linux-amd64/"
          tar -czf "dist/Pegasus-linux-${GITHUB_REF_NAME}-amd64.tar.gz" -C dist "Pegasus-${GITHUB_REF_NAME}-linux-amd64"
          rm -rf "dist/Pegasus-${GITHUB_REF_NAME}-linux-amd64"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Pegasus ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
