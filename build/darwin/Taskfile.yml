version: '3'

tasks:
  build:
    cmds:
      - go build -tags production -trimpath -ldflags="-w -s" -o "{{.OUTPUT}}" .
    vars:
      OUTPUT: '{{.OUTPUT | default "bin/Pegasus"}}'
    env:
      GOOS: darwin
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: 1
      CGO_CFLAGS: -mmacosx-version-min=12.0
      CGO_LDFLAGS: -mmacosx-version-min=12.0
      MACOSX_DEPLOYMENT_TARGET: '12.0'

  build:universal:
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: bin/Pegasus-amd64
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: bin/Pegasus-arm64
    cmds:
      - lipo -create -output bin/Pegasus bin/Pegasus-amd64 bin/Pegasus-arm64
      - rm bin/Pegasus-amd64 bin/Pegasus-arm64
