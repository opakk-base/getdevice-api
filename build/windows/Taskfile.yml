version: '3'

tasks:
  build:
    cmds:
      - wails3 generate icons -input build/appicon.png -windowsfilename build/windows/icon.ico
      - wails3 generate syso -arch {{.ARCH}} -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -out wails_windows_{{.ARCH}}.syso
      - go build -tags production -trimpath -ldflags="-w -s -H windowsgui" -o bin/Pegasus.exe .
      - cmd: powershell Remove-Item wails_windows_{{.ARCH}}.syso
        platforms: [windows]
      - cmd: rm -f wails_windows_{{.ARCH}}.syso
        platforms: [linux, darwin]
    vars:
      ARCH: '{{.ARCH | default "amd64"}}'
    env:
      GOOS: windows
      GOARCH: '{{.ARCH}}'
      CGO_ENABLED: 0
