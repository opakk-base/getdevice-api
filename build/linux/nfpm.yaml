# nfpm configuration for GetDevice Linux packages (.deb / .rpm / archlinux)
#
# Usage (from repo root, after `wails build -platform linux/amd64`):
#   nfpm package -f build/linux/nfpm.yaml -p deb    -t dist/
#   nfpm package -f build/linux/nfpm.yaml -p rpm    -t dist/
#   nfpm package -f build/linux/nfpm.yaml -p archlinux -t dist/
#
# The binary must already exist at build/bin/GetDevice
# (that is where the Wails CLI puts it for single-target linux builds).
# The Makefile 'installer-linux' target wires this up for you.
#
# Docs: https://nfpm.goreleaser.com/configuration/

name: getdevice
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional

# Maintainer shown in package metadata (deb control file, rpm changelog, ...)
maintainer: opakk <opakk@users.noreply.github.com>
description: |-
  GetDevice — local device-information API server with a native control panel.
  Runs a small HTTP API (/getdevice, /health) that reports device ID, hostname,
  OS details and network information, controlled from a native desktop window.

vendor: opakk
homepage: https://github.com/opakk-base/getdevice-api
license: MIT

# 'contains' keeps config on upgrade/uninstall; users can still purge it on deb
contents:
  - src: build/bin/GetDevice
    dst: /usr/bin/GetDevice
  - src: build/linux/getdevice.desktop
    dst: /usr/share/applications/getdevice.desktop
  - src: build/linux/icons/getdevice.png
    dst: /usr/share/icons/hicolor/512x512/apps/getdevice.png
  # Some minimal desktop environments only scan the legacy pixmaps directory
  - src: build/linux/icons/getdevice.png
    dst: /usr/share/pixmaps/getdevice.png

# Runtime dependencies pulled in by apt/dnf/pacman on install.
# Wails v2 links against GTK3 + WebKit2GTK; both 4.0 and 4.1 API variants work
# because the binary embeds whichever it was compiled against. We ship the
# webkit2_41 build so modern distros (Ubuntu 22.04+, Fedora 36+) are covered;
# the 4.0 fallback list below helps older ones via virtual provides where available.
depends:
  - gtk3
  - libwebkit2gtk-4.1-0
  - libayatana-appindicator3-1

overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
      - libayatana-appindicator3-gtk3

scripts:
  # Nothing to compile/configure; hooks kept explicit for clarity.
  postinstall: build/linux/scripts/postinst.sh
  postremove: build/linux/scripts/postrm.sh
