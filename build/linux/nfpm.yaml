# nfpm configuration for Pegasus Linux packages (.deb / .rpm / archlinux)
#
# Usage (from repo root, after building the Linux binary):
#   nfpm package -f build/linux/nfpm.yaml -p deb    -t dist/
#   nfpm package -f build/linux/nfpm.yaml -p rpm    -t dist/
#   nfpm package -f build/linux/nfpm.yaml -p archlinux -t dist/
#
# The binary must already exist at bin/Pegasus.
# The Linux release workflow packages this as a deb and rpm.
#
# Docs: https://nfpm.goreleaser.com/configuration/

name: pegasus
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional

# Maintainer shown in package metadata (deb control file, rpm changelog, ...)
maintainer: opakk <opakk@users.noreply.github.com>
description: |-
  Pegasus — local device-information API server with a native control panel.
  Runs a small HTTP API (/getdevice, /health) that reports device ID, hostname,
  OS details and network information, controlled from a native desktop window.

vendor: opakk
homepage: https://github.com/opakk-base/getdevice-api
license: MIT

# 'contains' keeps config on upgrade/uninstall; users can still purge it on deb
contents:
  - src: bin/Pegasus
    dst: /usr/bin/Pegasus
  - src: build/linux/pegasus.desktop
    dst: /usr/share/applications/pegasus.desktop
  - src: build/linux/icons/pegasus.png
    dst: /usr/share/icons/hicolor/512x512/apps/pegasus.png
  # Some minimal desktop environments only scan the legacy pixmaps directory
  - src: build/linux/icons/pegasus.png
    dst: /usr/share/pixmaps/pegasus.png

# Runtime dependencies pulled in by apt/dnf/pacman on install.
# Wails v3 uses GTK4 and WebKitGTK 6.0 on Linux.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

scripts:
  # Nothing to compile/configure; hooks kept explicit for clarity.
  postinstall: build/linux/scripts/postinst.sh
  postremove: build/linux/scripts/postrm.sh
